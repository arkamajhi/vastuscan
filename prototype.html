<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Prototype</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

background:
linear-gradient(
180deg,
#f7f8fb,
#eef2f5
);

font-family:
Inter,
sans-serif;

}


.viewer{

width:100vw;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}


/* DEVICE */

.device{

position:relative;

overflow:hidden;

background:#111;

box-shadow:
0 50px 120px rgba(0,0,0,.18);

}


/* DESKTOP */

.desktop{

width:min(
1500px,
95vw
);

aspect-ratio:16/10;

padding:16px;

border-radius:24px;

}


.desktop::before{

content:"";

position:absolute;

top:8px;

left:50%;

transform:translateX(-50%);

width:10px;

height:10px;

background:#333;

border-radius:50%;

}


/* PHONE */

.mobile{

width:min(
430px,
95vw
);

aspect-ratio:9/19.5;

padding:14px;

border-radius:48px;

}


.mobile::before{

content:"";

position:absolute;

top:14px;

left:50%;

transform:translateX(-50%);

width:120px;

height:30px;

background:#000;

border-radius:30px;

z-index:50;

}


/* SCREEN */

.screen{

width:100%;

height:100%;

background:white;

overflow:hidden;

cursor:pointer;

border-radius:16px;

}


.mobile .screen{

border-radius:34px;

}


.screen img{

width:100%;

height:100%;

object-fit:contain;

display:block;

}


/* BUTTONS */

.arrow{

position:absolute;

top:50%;

transform:translateY(-50%);

width:56px;

height:56px;

border:none;

border-radius:999px;

font-size:28px;

background:white;

cursor:pointer;

z-index:20;

}


.prev{

left:20px;

}


.next{

right:20px;

}


@media(max-width:768px){

.arrow{

display:none;

}

}


/* DOTS */

.dots{

position:absolute;

bottom:20px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:10px;

z-index:20;

}


.dot{

width:12px;

height:12px;

border-radius:50%;

background:#ccc;

cursor:pointer;

}


.dot.active{

background:#111;

}


/* UI */

.counter{

position:absolute;

top:20px;

right:20px;

padding:10px 16px;

background:white;

border-radius:999px;

z-index:20;

}


.fullscreen{

position:absolute;

top:20px;

left:20px;

padding:10px 16px;

border:none;

border-radius:999px;

background:white;

cursor:pointer;

z-index:20;

}

</style>

</head>

<body>

<div class="viewer">

<div
id="device"
class="device">

<button class="fullscreen">
⛶
</button>

<div class="counter">

<span id="count">
1
</span>

/ 7

</div>

<button class="arrow prev">
‹
</button>

<div class="screen">

<img id="screen">

</div>

<button class="arrow next">
›
</button>

<div class="dots">

</div>

</div>

</div>


<script>


const mobile =
window.innerWidth
<=768;


const device=
document.getElementById(
"device"
);


device.classList.add(

mobile

?

"mobile"

:

"desktop"

);


const folder=

mobile

?

"prototype/mobile/"

:

"prototype/desktop/";


const screens=[

folder+"screen1.png",
folder+"screen2.png",
folder+"screen3.png",
folder+"screen4.png",
folder+"screen5.png",
folder+"screen6.png",
folder+"screen7.png"

];


let current=0;

const image=
document.getElementById(
"screen"
);

const counter=
document.getElementById(
"count"
);

const dots=
document.querySelector(
".dots"
);

const screen=
document.querySelector(
".screen"
);


function render(){

image.src=
screens[current];

counter.innerHTML=
current+1;

document
.querySelectorAll(
".dot"
)

.forEach(

(d,i)=>

d.classList.toggle(
"active",
i===current

)

);

}


function next(){

current=
(
current+1
)
%
screens.length;

render();

}


function prev(){

current=
(
current-1+
screens.length
)
%
screens.length;

render();

}


screens.forEach((_,i)=>{

const dot=
document.createElement(
"div"
);

dot.className=
"dot";

if(i===0)
dot.classList.add(
"active"
);

dot.onclick=
e=>{

e.stopPropagation();

current=i;

render();

};

dots.append(
dot);

});


document
.querySelector(
".next"
)
.onclick=
e=>{

e.stopPropagation();

next();

};


document
.querySelector(
".prev"
)
.onclick=
e=>{

e.stopPropagation();

prev();

};


screen.addEventListener(
"click",
next
);


/* SWIPE */

let start=0;


screen.addEventListener(

"touchstart",

e=>{

start=
e.touches[0]
.clientX;

}

);


screen.addEventListener(

"touchend",

e=>{

let end=
e.changedTouches[0]
.clientX;

let diff=
end-start;


if(
Math.abs(diff)
>40
){

if(diff<0)
next();

else
prev();

}

else{

next();

}

}

);


/* FULLSCREEN */

document
.querySelector(
".fullscreen"
)

.onclick=
()=>{

if(
!document
.fullscreenElement
)

device
.requestFullscreen();

else

document
.exitFullscreen();

};


render();

</script>

</body>

</html>
